name: ${COMPOSE_PROJECT_NAME:-campus-sandbox}

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-campus}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-campus}
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1.0}
  EVENT_STREAM: ${EVENT_STREAM:-campus:events}
  CONSUMER_RETRY_IDLE_MS: ${CONSUMER_RETRY_IDLE_MS:-1000}
  CONSUMER_RECONCILE_INTERVAL_SECONDS: ${CONSUMER_RECONCILE_INTERVAL_SECONDS:-3.0}

x-backend: &backend
  # API is the sole image build owner; workers reuse its exact image tag.
  image: ${BACKEND_IMAGE:-campus-sandbox-backend:dev}
  pull_policy: never
  environment: *backend-environment
  init: true
  restart: unless-stopped
  stop_grace_period: 20s

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *backend
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile
    # One migration owner avoids API/worker migration races; exec forwards signals.
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  runtime:
    <<: *backend
    command: ["python", "-m", "app.workers.runtime"]
    depends_on:
      api:
        condition: service_healthy

  cognition:
    <<: *backend
    command: ["python", "-m", "app.workers.cognition"]
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
